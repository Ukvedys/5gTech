name: Diegimas į serverį

# Paleidžiama tik tada, kai keičiasi tema arba papildinys.
on:
  push:
    branches: [ main ]
    paths:
      - 'wordpress/wp-content/themes/5gtech/**'
      - 'wordpress/wp-content/plugins/5gtech-core/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Kur diegti'
        required: true
        default: 'staging'
        type: choice
        options: [ staging, live ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Kompiliuoti ir įkelti
    runs-on: ubuntu-latest

    steps:
      - name: Paimti kodą
        uses: actions/checkout@v4

      - name: Paruošti PHP sintaksės tikrinimą
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Patikrinti PHP sintaksę
        run: |
          set -e
          find wordpress/wp-content/plugins/5gtech-core -name '*.php' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null
          find wordpress/wp-content/themes/5gtech -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /dev/null
          echo "PHP sintaksė švari"

      - name: Paruošti Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wordpress/wp-content/plugins/5gtech-core/package-lock.json

      - name: Sukompiliuoti blokus
        working-directory: wordpress/wp-content/plugins/5gtech-core
        run: |
          set -e
          npm ci

          # Senas `build/` ištrinamas, kad patikra tikrai matytų naują rezultatą,
          # o ne repozitorijoje gulinčius senus failus.
          rm -rf build
          npm run build

          # Kiekvienas šaltinio katalogas privalo turėti atitikmenį `build/`.
          TRUKSTA=""
          for DIR in blocks-src/*/; do
            NAME=$(basename "$DIR")
            if [ ! -f "build/$NAME/block.json" ]; then
              TRUKSTA="$TRUKSTA $NAME"
            fi
          done

          if [ -n "$TRUKSTA" ]; then
            echo "::error::Nesukompiliuoti blokai:$TRUKSTA"
            exit 1
          fi

          echo "Sukompiliuota blokų: $(ls build | wc -l)"

      - name: Prijungti SSH raktą
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pasitikėti serverio pirštų atspaudu
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Nustatyti tikslinį katalogą
        id: target
        run: |
          if [ "${{ github.event.inputs.target }}" = "live" ]; then
            TARGET_PATH="${{ secrets.REMOTE_PATH_LIVE }}"
            echo "Diegiama į LIVE"
          else
            TARGET_PATH="${{ secrets.REMOTE_PATH_STAGING }}"
            echo "Diegiama į STAGING"
          fi

          # Apsauga: tuščias kelias reikštų kėlimą į namų katalogo šaknį.
          if [ -z "$TARGET_PATH" ]; then
            echo "::error::Tikslinis kelias tuščias. Patikrinkite REMOTE_PATH_STAGING ir REMOTE_PATH_LIVE secrets."
            exit 1
          fi

          case "$TARGET_PATH" in
            /*) ;;
            *) echo "::error::Kelias turi būti absoliutus (prasidėti nuo /). Gauta: $TARGET_PATH"; exit 1 ;;
          esac

          echo "path=$TARGET_PATH" >> "$GITHUB_OUTPUT"

      - name: Patikrinti, ar tai WordPress katalogas
        run: |
          ssh -p ${{ secrets.SSH_PORT }} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "test -d '${{ steps.target.outputs.path }}/wp-content' || { echo 'Nerastas wp-content — kelias neteisingas'; exit 1; }"
          echo "Katalogas patvirtintas"

      - name: Įkelti temą
        run: |
          rsync -az --delete \
            --exclude '.DS_Store' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            wordpress/wp-content/themes/5gtech/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ steps.target.outputs.path }}/wp-content/themes/5gtech/"

      - name: Įkelti papildinį
        run: |
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude 'blocks-src' \
            --exclude 'package-lock.json' \
            --exclude '.DS_Store' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            wordpress/wp-content/plugins/5gtech-core/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ steps.target.outputs.path }}/wp-content/plugins/5gtech-core/"

      - name: Santrauka
        run: |
          echo "### Diegimas baigtas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tema: \`wp-content/themes/5gtech\`" >> $GITHUB_STEP_SUMMARY
          echo "- Papildinys: \`wp-content/plugins/5gtech-core\` (su sukompiliuotais blokais)" >> $GITHUB_STEP_SUMMARY
          echo "- Nepaliesta: WordPress branduolys, svetimi papildiniai, \`uploads/\`, duomenų bazė" >> $GITHUB_STEP_SUMMARY
