name: Diegimas į serverį

# Push į main atnaujina staging kodą ir, kol yra SYNC-ON, WordPress turinį.
on:
  push:
    branches: [ main ]
    paths:
      - 'wordpress/wp-content/themes/5gtech/**'
      - 'wordpress/wp-content/plugins/5gtech-core/**'
      - 'wordpress/wp-content/plugins/polylang/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Kur diegti'
        required: true
        default: 'staging'
        type: choice
        options: [ staging, live ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Kompiliuoti ir įkelti
    runs-on: ubuntu-latest

    steps:
      - name: Paimti kodą
        uses: actions/checkout@v4

      - name: Paruošti PHP sintaksės tikrinimą
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Patikrinti PHP sintaksę
        run: |
          set -e
          find wordpress/wp-content/plugins/5gtech-core -name '*.php' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null
          find wordpress/wp-content/themes/5gtech -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /dev/null
          echo "PHP sintaksė švari"

      - name: Paruošti Polylang autoload
        run: |
          set -e
          composer install \
            --working-dir=wordpress/wp-content/plugins/polylang \
            --no-dev \
            --optimize-autoloader \
            --classmap-authoritative \
            --no-interaction \
            --no-progress
          test -f wordpress/wp-content/plugins/polylang/vendor/autoload.php
          echo "Polylang autoload paruoštas"

      - name: Paruošti Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wordpress/wp-content/plugins/5gtech-core/package-lock.json

      - name: Sukompiliuoti blokus
        working-directory: wordpress/wp-content/plugins/5gtech-core
        run: |
          set -e
          npm ci

          # Senas `build/` ištrinamas, kad patikra tikrai matytų naują rezultatą,
          # o ne repozitorijoje gulinčius senus failus.
          rm -rf build
          npm run build

          # Kiekvienas šaltinio katalogas privalo turėti atitikmenį `build/`.
          TRUKSTA=""
          for DIR in blocks-src/*/; do
            NAME=$(basename "$DIR")
            if [ ! -f "build/$NAME/block.json" ]; then
              TRUKSTA="$TRUKSTA $NAME"
            fi
          done

          if [ -n "$TRUKSTA" ]; then
            echo "::error::Nesukompiliuoti blokai:$TRUKSTA"
            exit 1
          fi

          echo "Sukompiliuota blokų: $(ls build | wc -l)"

      - name: Prijungti SSH raktą
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pasitikėti serverio pirštų atspaudu
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Nustatyti tikslinį katalogą
        id: target
        run: |
          if [ "${{ github.event.inputs.target }}" = "live" ]; then
            TARGET_PATH="${{ secrets.REMOTE_PATH_LIVE }}"
            echo "Diegiama į LIVE"
          else
            TARGET_PATH="${{ secrets.REMOTE_PATH_STAGING }}"
            echo "Diegiama į STAGING"
          fi

          # Apsauga: tuščias kelias reikštų kėlimą į namų katalogo šaknį.
          if [ -z "$TARGET_PATH" ]; then
            echo "::error::Tikslinis kelias tuščias. Patikrinkite REMOTE_PATH_STAGING ir REMOTE_PATH_LIVE secrets."
            exit 1
          fi

          case "$TARGET_PATH" in
            /*) ;;
            *) echo "::error::Kelias turi būti absoliutus (prasidėti nuo /). Gauta: $TARGET_PATH"; exit 1 ;;
          esac

          echo "path=$TARGET_PATH" >> "$GITHUB_OUTPUT"

      - name: Patikrinti, ar tai WordPress katalogas
        run: |
          ssh -p ${{ secrets.SSH_PORT }} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "test -d '${{ steps.target.outputs.path }}/wp-content' || { echo 'Nerastas wp-content — kelias neteisingas'; exit 1; }"
          echo "Katalogas patvirtintas"

      - name: Padaryti duomenų bazės atsarginę kopiją
        run: |
          ssh -p ${{ secrets.SSH_PORT }} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "bash -s -- '${{ steps.target.outputs.path }}'" <<'REMOTE'
          set -eu
          TARGET_PATH="$1"

          if command -v mariadb-dump >/dev/null 2>&1; then
            DUMP_COMMAND=$(command -v mariadb-dump)
          elif command -v mysqldump >/dev/null 2>&1; then
            DUMP_COMMAND=$(command -v mysqldump)
          else
            echo "Duomenų bazės kopijavimo programa serveryje nerasta — turinys nebus perrašomas"
            exit 1
          fi

          DB_CONFIG_OUTPUT=$(php -r '
            define( "SHORTINIT", true );
            $_SERVER["HTTP_HOST"] = "localhost";
            require rtrim( $argv[1], "/" ) . "/wp-load.php";
            $values = array();
            foreach ( array( "DB_NAME", "DB_USER", "DB_PASSWORD", "DB_HOST" ) as $name ) {
              $values[] = base64_encode( (string) constant( $name ) );
            }
            echo implode( "|", $values );
          ' "$TARGET_PATH")

          DB_NAME_ENCODED=${DB_CONFIG_OUTPUT%%|*}
          DB_CONFIG_REST=${DB_CONFIG_OUTPUT#*|}
          DB_USER_ENCODED=${DB_CONFIG_REST%%|*}
          DB_CONFIG_REST=${DB_CONFIG_REST#*|}
          DB_PASSWORD_ENCODED=${DB_CONFIG_REST%%|*}
          DB_HOST_ENCODED=${DB_CONFIG_REST#*|}

          test -n "$DB_NAME_ENCODED"
          test -n "$DB_USER_ENCODED"
          test -n "$DB_HOST_ENCODED"

          DB_NAME_VALUE=$(printf '%s' "$DB_NAME_ENCODED" | base64 --decode)
          DB_USER_VALUE=$(printf '%s' "$DB_USER_ENCODED" | base64 --decode)
          DB_PASSWORD_VALUE=$(printf '%s' "$DB_PASSWORD_ENCODED" | base64 --decode)
          DB_HOST_VALUE=$(printf '%s' "$DB_HOST_ENCODED" | base64 --decode)

          DB_SERVER_VALUE="$DB_HOST_VALUE"
          DB_PORT_VALUE=""
          DB_SOCKET_VALUE=""

          if [[ "$DB_HOST_VALUE" =~ ^([^:]+):([0-9]+)$ ]]; then
            DB_SERVER_VALUE="${BASH_REMATCH[1]}"
            DB_PORT_VALUE="${BASH_REMATCH[2]}"
          elif [[ "$DB_HOST_VALUE" =~ ^([^:]+):(.+)$ ]]; then
            DB_SERVER_VALUE="${BASH_REMATCH[1]}"
            DB_SOCKET_VALUE="${BASH_REMATCH[2]}"
          fi

          BACKUP_PARENT=$(dirname "$TARGET_PATH")
          BACKUP_DIR="$BACKUP_PARENT/.g5tech-backups"
          BACKUP_FILE="$BACKUP_DIR/pre-local-sync-$(date -u +%Y%m%dT%H%M%SZ).sql"
          BACKUP_PARTIAL="$BACKUP_FILE.partial"

          mkdir -p "$BACKUP_DIR"

          DUMP_ARGS=(
            --host="$DB_SERVER_VALUE"
            --user="$DB_USER_VALUE"
            --single-transaction
            --skip-lock-tables
            --default-character-set=utf8mb4
          )

          if [ -n "$DB_PORT_VALUE" ]; then
            DUMP_ARGS+=( --port="$DB_PORT_VALUE" )
          fi

          if [ -n "$DB_SOCKET_VALUE" ]; then
            DUMP_ARGS+=( --socket="$DB_SOCKET_VALUE" )
          fi

          MYSQL_PWD="$DB_PASSWORD_VALUE" "$DUMP_COMMAND" "${DUMP_ARGS[@]}" "$DB_NAME_VALUE" > "$BACKUP_PARTIAL"
          test -s "$BACKUP_PARTIAL"
          mv "$BACKUP_PARTIAL" "$BACKUP_FILE"
          echo "Duomenų bazės kopija sukurta: $(basename "$BACKUP_FILE")"
          REMOTE

      - name: Įkelti temą
        run: |
          rsync -az --delete \
            --exclude '.DS_Store' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            wordpress/wp-content/themes/5gtech/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ steps.target.outputs.path }}/wp-content/themes/5gtech/"

      - name: Įkelti papildinį
        run: |
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude 'blocks-src' \
            --exclude 'package-lock.json' \
            --exclude '.DS_Store' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            wordpress/wp-content/plugins/5gtech-core/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ steps.target.outputs.path }}/wp-content/plugins/5gtech-core/"

      - name: Įkelti Polylang
        run: |
          rsync -az --delete \
            --exclude '.DS_Store' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            wordpress/wp-content/plugins/polylang/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ steps.target.outputs.path }}/wp-content/plugins/polylang/"

      - name: Įkelti vietinio turinio momentinį įrašą
        run: |
          rsync -az --delete \
            --exclude 'uploads/' \
            --exclude '*.md' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            deploy/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ steps.target.outputs.path }}/wp-content/g5-deploy/"

          rsync -az \
            --exclude '.DS_Store' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            deploy/uploads/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ steps.target.outputs.path }}/wp-content/uploads/"

      - name: Pritaikyti vietinį WordPress turinį
        run: |
          ssh -p ${{ secrets.SSH_PORT }} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "bash -s -- '${{ steps.target.outputs.path }}'" <<'REMOTE'
          set -eu
          TARGET_PATH="$1"

          set +e
          php \
            -d display_errors=1 \
            -d display_startup_errors=1 \
            -d error_reporting=-1 \
            "$TARGET_PATH/wp-content/g5-deploy/sync-content.php"
          SYNC_RESULT=$?
          set -e

          if [ "$SYNC_RESULT" -eq 75 ]; then
            set +e
            php \
              -d display_errors=1 \
              -d display_startup_errors=1 \
              -d error_reporting=-1 \
              "$TARGET_PATH/wp-content/g5-deploy/sync-content.php"
            SYNC_RESULT=$?
            set -e
          fi

          if [ "$SYNC_RESULT" -ne 0 ]; then
            echo "Sinchronizavimo diagnostika (paskutinės žurnalo eilutės):"

            if [ -f "$TARGET_PATH/wp-content/debug.log" ]; then
              tail -n 80 "$TARGET_PATH/wp-content/debug.log" || true
            elif [ -f "$TARGET_PATH/error_log" ]; then
              tail -n 80 "$TARGET_PATH/error_log" || true
            else
              echo "WordPress klaidų žurnalas nerastas"
            fi

            exit "$SYNC_RESULT"
          fi

          wp cache flush --path="$TARGET_PATH" || true

          if wp plugin is-active litespeed-cache --path="$TARGET_PATH" >/dev/null 2>&1; then
            wp litespeed-purge all --path="$TARGET_PATH" || true
          fi
          REMOTE

      - name: Santrauka
        run: |
          echo "### Diegimas baigtas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tema: \`wp-content/themes/5gtech\`" >> $GITHUB_STEP_SUMMARY
          echo "- Papildinys: \`wp-content/plugins/5gtech-core\` (su sukompiliuotais blokais)" >> $GITHUB_STEP_SUMMARY
          echo "- Kalbos: \`Polylang\` iš repozitorijos" >> $GITHUB_STEP_SUMMARY
          echo "- Turinys: vietinis momentinis įrašas pritaikytas, jei yra \`deploy/content/SYNC-ON\`" >> $GITHUB_STEP_SUMMARY
          echo "- Atsarginė kopija: prieš turinio keitimą išsaugota už viešo WordPress katalogo" >> $GITHUB_STEP_SUMMARY
          echo "- Nepaliesta: WordPress branduolys ir kiti papildiniai" >> $GITHUB_STEP_SUMMARY
